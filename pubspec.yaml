name: handy_speak
description: "HandySpeak — a bilingual AAC tablet app for children (POC)."
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Native launch screen (shown by the OS while the Flutter engine warms up).
# Generated into android/ios/web with: dart run flutter_native_splash:create
# Brand green background + the white sun glyph (the icon's transparent foreground).
flutter_native_splash:
  color: "#1fa567"
  image: assets/icon/foreground.png
  android: true
  ios: true
  web: false
  # Android 12+ uses the system splash API: icon centered on the brand color.
  android_12:
    image: assets/icon/foreground.png
    icon_background_color: "#1fa567"

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1fa567"
    theme_color: "#1fa567"
